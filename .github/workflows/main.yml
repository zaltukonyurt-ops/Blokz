name: BLOKZ APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Zip'i ac
        run: unzip -q blokz-android.zip -d proj

      - name: Bagimliliklar ve senkron
        working-directory: proj
        run: |
          npm ci
          npx cap sync android

      - name: Debug APK derle
        working-directory: proj/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK dosyasini hazirla
        run: cp proj/android/app/build/outputs/apk/debug/app-debug.apk blokz.apk

      - name: Artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: blokz-apk
          path: blokz.apk

      - name: Release olarak yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" blokz.apk --title "BLOKZ build ${{ github.run_number }}" --notes "Debug APK" --latest
